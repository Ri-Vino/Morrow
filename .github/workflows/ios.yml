# Builds the iOS app on a cloud Mac, since it can't be built on Windows. It proves the code compiles; ringing still
# needs testing on an iPhone.
name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile the shared code for iOS
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # Compile errors also go up as annotations, which show on the run's page without opening the log.
      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild build             -project iosApp/Morrow.xcodeproj             -scheme Morrow             -configuration Debug             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
            grep -E '(error:|^e: )' build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line//$GITHUB_WORKSPACE\//}"
            done
            exit 1
          }
