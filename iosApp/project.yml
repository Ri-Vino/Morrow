# The Xcode project, generated rather than checked in. On a Mac, from this folder: xcodegen generate
name: Morrow
options:
  bundleIdPrefix: app.morrow
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep these in step with versionName and versionCode in androidApp/build.gradle.kts. App Store Connect takes
    # only numbers in MARKETING_VERSION, so the beta label goes in MORROW_VERSION_LABEL, which the app shows.
    MARKETING_VERSION: 0.9.0
    MORROW_VERSION_LABEL: 0.9.0-beta.1
    CURRENT_PROJECT_VERSION: 1
    # The shared framework is built for Apple silicon simulators only (iosSimulatorArm64).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  Morrow:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Common
    dependencies:
      # Embedded in the app: AlarmKit's countdowns need its Live Activity.
      - target: MorrowWidgets
    scheme: {}
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.morrow
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # The Gradle build step writes outside the project, which Xcode's script sandbox would block.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
  # The timers' countdown on the Lock Screen and in the Dynamic Island. Swift only; it doesn't use the Kotlin framework.
  MorrowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MorrowWidgets
      - path: Common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.morrow.widgets
        INFOPLIST_FILE: MorrowWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
